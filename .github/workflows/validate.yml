name: Validate Prompting

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: prompting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r prompting/requirements-dev.txt
      - name: Run static Skill audit
        run: python prompting/scripts/audit_skill.py prompting --portable
      - name: Run auditor regression tests
        run: python prompting/scripts/test_audit_skill.py
